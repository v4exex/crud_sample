<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리뷰쓰기</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <style>
        :root {
            --bg: #fafafa;
            --card: #ffffff;
            --text: #111111;
            --muted: #8b8b94;
            --line: rgba(0, 0, 0, 0.1);
            --accent: #5b5bf0;
            --accent-soft: rgba(91, 91, 240, 0.15);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b0b0d;
                --card: #151518;
                --text: #f4f4f5;
                --muted: #7c7c86;
                --line: rgba(255, 255, 255, 0.12);
                --accent: #8b8bff;
                --accent-soft: rgba(139, 139, 255, 0.2);
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            padding: 72px 20px;
            background: var(--bg);
            color: var(--text);
            font-family: Pretendard, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 520px;
            margin: 0 auto;
        }
        .eyebrow {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--accent);
            margin-bottom: 8px;
        }
        h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin: 0 0 28px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 28px 24px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 22px;
        }
        label {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .field-label {
            font-size: 14px;
            font-weight: 600;
        }
        .star-rating {
            display: inline-flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            gap: 4px;
        }
        .star-rating input {
            position: absolute;
            opacity: 0;
            width: 1px;
            height: 1px;
            pointer-events: none;
        }
        .star-rating label {
            display: block;
            font-size: 40px;
            line-height: 1;
            color: rgba(128, 128, 140, 0.35);
            cursor: pointer;
            transition: color 0.15s ease, transform 0.15s ease;
        }
        .star-rating label:hover { transform: scale(1.12); }
        .star-rating input:checked ~ label,
        .star-rating label:hover,
        .star-rating label:hover ~ label { color: #ffb400; }
        .star-rating input:focus-visible + label {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
            border-radius: 6px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 14px;
            color: var(--text);
            font-family: inherit;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft);
        }
        input[type="submit"] {
            margin-top: 4px;
            padding: 15px 16px;
            border: none;
            border-radius: 14px;
            background: var(--accent);
            color: #fff;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 24px -10px var(--accent);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        input[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px -10px var(--accent);
        }
        .back {
            display: inline-block;
            margin-top: 20px;
            font-size: 14px;
            color: var(--muted);
            text-decoration: none;
        }
        .back:hover { color: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <div class="eyebrow">NEW REVIEW</div>
        <h1>리뷰 수정하기</h1>
        <form action="/stores/{{ store_id }}/review/{{ review_id }}/update" method="post">
            <div class="field">
                <span class="field-label">평점</span>
                <div class="star-rating">
                    <input type="radio" name="score" id="score5" value="5" required {{ 'checked' if review.score == 5 }} /><label for="score5" title="5점">★</label>
                    <input type="radio" name="score" id="score4" value="4" {{ 'checked' if review.score == 4 }} /><label for="score4" title="4점">★</label>
                    <input type="radio" name="score" id="score3" value="3" {{ 'checked' if review.score == 3 }} /><label for="score3" title="3점">★</label>
                    <input type="radio" name="score" id="score2" value="2" {{ 'checked' if review.score == 2 }} /><label for="score2" title="2점">★</label>
                    <input type="radio" name="score" id="score1" value="1" {{ 'checked' if review.score == 1 }} /><label for="score1" title="1점">★</label>                </div>
            </div>
            <label>
                리뷰
                <input type="text" name="comment" value="{{ review.comment }}" />
            </label>
            <input type="submit" value="수정하기" />
        </form>
        <a class="back" href="/stores/{{ store_id }}">← 돌아가기</a>
    </div>
</body>
</html>
